<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Flagship System Blue Squircle Background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#389bff" />
      <stop offset="55%" stop-color="#007aff" />
      <stop offset="100%" stop-color="#0056cc" />
    </linearGradient>

    <!-- Subtle Top Specular Edge -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04" />
    </linearGradient>

    <!-- Crisp Document Sheet -->
    <linearGradient id="sheetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f2f2f7" />
    </linearGradient>

    <!-- Warm Sun Accent -->
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd60a" />
      <stop offset="100%" stop-color="#ff9f0a" />
    </linearGradient>

    <!-- Photo Landscape Silhouettes -->
    <linearGradient id="mountainGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a84ff" />
      <stop offset="100%" stop-color="#0056cc" />
    </linearGradient>

    <linearGradient id="mountainGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64d2ff" />
      <stop offset="100%" stop-color="#0a84ff" />
    </linearGradient>

    <!-- Clean System Red PDF Pill -->
    <linearGradient id="pdfBadgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff453a" />
      <stop offset="100%" stop-color="#d92d20" />
    </linearGradient>

    <!-- Fold Corner Flap -->
    <linearGradient id="foldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d1d1d6" />
      <stop offset="100%" stop-color="#aeaeb2" />
    </linearGradient>

    <!-- Natural Neutral Shadows (No Colored Glows) -->
    <filter id="shadowSquircle" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.22" />
    </filter>
    <filter id="shadowSheet" x="-15%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.20" />
    </filter>
    <filter id="shadowBadge" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.24" />
    </filter>

    <clipPath id="sheetClip">
      <rect x="146" y="152" width="220" height="176" rx="14" />
    </clipPath>
  </defs>

  <!-- Squircle Base Icon Container -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" filter="url(#shadowSquircle)" />

  <!-- Subtle Specular Border -->
  <rect x="26" y="26" width="460" height="460" rx="106" fill="none" stroke="url(#glassGrad)" stroke-width="3" />

  <!-- Document Sheet with Folded Corner -->
  <path d="M 148 96 L 324 96 L 388 160 L 388 392 A 20 20 0 0 1 368 412 L 148 412 A 20 20 0 0 1 128 392 L 128 116 A 20 20 0 0 1 148 96 Z"
        fill="url(#sheetGrad)"
        filter="url(#shadowSheet)" />

  <!-- Folded Corner Flap -->
  <path d="M 324 96 L 324 146 A 14 14 0 0 0 338 160 L 388 160 Z"
        fill="url(#foldGrad)" />

  <!-- Inner Picture Window -->
  <g clip-path="url(#sheetClip)">
    <rect x="146" y="152" width="220" height="176" rx="14" fill="#0d1b2a" />
    <circle cx="292" cy="198" r="24" fill="url(#sunGrad)" />
    <polygon points="120,328 212,216 304,328" fill="url(#mountainGrad2)" />
    <polygon points="204,328 274,238 376,328" fill="url(#mountainGrad1)" />
  </g>

  <!-- Crisp Picture Frame Border -->
  <rect x="146" y="152" width="220" height="176" rx="14" fill="none" stroke="#e5e5ea" stroke-width="2" />

  <!-- Crisp PDF Badge -->
  <g filter="url(#shadowBadge)">
    <rect x="250" y="348" width="130" height="46" rx="11" fill="url(#pdfBadgeGrad)" />
    <text x="315" y="379" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif"
          font-size="22" font-weight="800" fill="#ffffff" letter-spacing="2" text-anchor="middle">PDF</text>
  </g>
</svg>